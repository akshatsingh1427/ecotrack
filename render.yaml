services:
  - type: web
    name: ecotrack
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn ecotrack.wsgi
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecotrack-db
          property: connectionString
databases:
  - name: ecotrack-db
    plan: free
